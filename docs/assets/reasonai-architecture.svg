<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 866" role="img" aria-labelledby="title desc">
<title id="title">ReasonAI architecture with Nebius Nemotron tool calls to Tavily Search and separate offline knowledge enrichment</title>
<desc id="desc">Authenticated web and mobile clients access deterministic Pyodide, sandbox judging, validation, collaboration, and state. Nebius Nemotron invokes a validated LangGraph search_web tool; it makes bounded server-side Tavily Search API calls, validates results, and sends evidence back to Nemotron. Separately, a Knowledge refresh worker uses Tavily news discovery before Nemotron enrichment and storage. No client-side provider keys.</desc>
