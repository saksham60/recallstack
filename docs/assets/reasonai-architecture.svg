<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 558" role="img" aria-labelledby="title desc">
<title id="title">ReasonAI architecture: deterministic execution and NVIDIA Nemotron reasoning</title>
<desc id="desc">Web and Flutter clients use authenticated server routes. Deterministic systems perform public test execution, sandbox judging, canvas validation, websocket collaboration and persistence. LangGraph orchestrates NVIDIA Nemotron through Nebius Token Factory and bounded Tavily research. Users approve canvas changes before they become operations.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10182c"/><stop offset=".55" stop-color="#0b1020"/><stop offset="1" stop-color="#17132c"/></linearGradient>
 <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#15b8b4"/><stop offset="1" stop-color="#58dfc9"/></linearGradient>
 <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#746bfb"/><stop offset="1" stop-color="#b291fa"/></linearGradient>
 <linearGradient id="soft" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5ad7d1" stop-opacity=".1"/><stop offset="1" stop-color="#9580ff" stop-opacity=".10"/></linearGradient>
 <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="3"/></filter>
 <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#8799be"/></marker>
</defs>
<rect width="1180" height="558" rx="24" fill="url(#bg)"/>
