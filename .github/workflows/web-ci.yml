name: Web CI

on:
  pull_request:
    paths: ["web/**", ".github/workflows/web-ci.yml"]
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web-ci.yml"]

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:8080"
      NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder"
      NEXT_PUBLIC_REALTIME_BASE_URL: "http://localhost:8081"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # Next resolves this marker during bundling. Some Playwright specs import
      # protected server modules directly, so install the marker without
      # re-resolving the repository's existing peer dependency tree.
      - name: Install server-only marker for direct tests
        run: npm install --no-save --package-lock=false --legacy-peer-deps server-only@0.0.1

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Playwright verification suites
        env:
          NODE_OPTIONS: "--conditions=react-server"
        run: |
          npm run test:system-design-state
          npm run test:e2e
          npm run test:e2e:system-design-disabled
