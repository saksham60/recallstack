name: Web CI

on:
  pull_request:
    paths: ["web/**", ".github/workflows/web-ci.yml"]
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web-ci.yml"]

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:8080"
      NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder"
      NEXT_PUBLIC_REALTIME_BASE_URL: "http://localhost:8081"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Ubuntu 24.04 restricts user namespaces for downloaded browsers. Allow only
      # these installed executables; keep Chromium's sandbox and global policy on.
      # https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
      - name: Permit sandboxed certification Chromium
        run: |
          profile_file="$RUNNER_TEMP/reasonai-playwright-apparmor"
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\n' > "$profile_file"
          profile_index=0
          while IFS= read -r browser_path; do
            printf 'profile reasonai-playwright-%s "%s" flags=(unconfined) {\n  userns,\n}\n' "$profile_index" "$browser_path" >> "$profile_file"
            profile_index=$((profile_index + 1))
          done < <(find "$HOME/.cache/ms-playwright" -type f \( -name chrome -o -name chrome-headless-shell -o -name headless_shell \))
          test "$profile_index" -gt 0
          sudo install -m 644 "$profile_file" /etc/apparmor.d/reasonai-playwright
          sudo apparmor_parser -r /etc/apparmor.d/reasonai-playwright
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch({ headless: true, chromiumSandbox: true });
          await browser.close();
          NODE

      - name: Typecheck
        run: npm run typecheck

      - name: Shared Python source parity
        run: npm run dsa:harness:check

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Next enforces the server-only boundary during the production build above.
      # A few Playwright specs also import those modules directly under plain Node,
      # so provide a no-op marker only for that direct-test runtime. This does not
      # mutate package-lock.json or re-resolve the npm dependency graph.
      - name: Provide server-only marker for direct tests
        run: |
          mkdir -p node_modules/server-only
          cat > node_modules/server-only/package.json <<'EOF'
          {
            "name": "server-only",
            "version": "0.0.1-ci",
            "exports": {
              ".": "./index.js"
            }
          }
          EOF
          : > node_modules/server-only/index.js

      - name: DSA execution contracts and worker lifecycle
        env:
          DSA_TEST_PYTHON: python3
        run: npm run test:executions

      - name: DSA migration and persistence compatibility
        run: npm run test:dsa-db

      - name: DSA browser regression
        run: npx playwright test e2e/dsa-studio.spec.ts e2e/dsa-execution-browser.spec.ts e2e/dsa-workspace.spec.ts e2e/dsa-pagination.spec.ts e2e/dsa-navigation.spec.ts e2e/dsa-report-browser.spec.ts --reporter=line

      - name: Actual Pyodide execution matrix
        run: npx playwright test e2e/dsa-python-real.spec.ts --workers=1 --reporter=line

      # Keep E2E coverage visible without allowing a flaky browser timing test to
      # block an otherwise healthy web build. Typecheck, lint, and production build
      # remain hard gates above.
      - name: Playwright verification suites
        continue-on-error: true
        run: |
          npm run test:system-design-state
          npm run test:e2e
          npm run test:e2e:system-design-disabled
