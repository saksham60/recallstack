name: Mobile CI

on:
  workflow_dispatch:
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile-ci.yml"]
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile-ci.yml"]

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.5"
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generated code is committed and current
        run: git diff --exit-code

      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - name: Prepare public production configuration
        env:
          MOBILE_API_BASE_URL: ${{ vars.MOBILE_API_BASE_URL }}
          MOBILE_WEB_BASE_URL: ${{ vars.MOBILE_WEB_BASE_URL }}
          MOBILE_SUPABASE_URL: ${{ vars.MOBILE_SUPABASE_URL }}
          MOBILE_SUPABASE_ANON_KEY: ${{ vars.MOBILE_SUPABASE_ANON_KEY }}
        run: dart run tool/prepare_build.dart --ci
      - run: flutter build apk --debug --target-platform android-arm,android-arm64,android-x64 --dart-define-from-file=build/verified-defines.json
      - uses: actions/upload-artifact@v4
        with:
          name: reasonai-android-debug-${{ github.sha }}
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  ios-unsigned:
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.5"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Prepare public production configuration
        env:
          MOBILE_API_BASE_URL: ${{ vars.MOBILE_API_BASE_URL }}
          MOBILE_WEB_BASE_URL: ${{ vars.MOBILE_WEB_BASE_URL }}
          MOBILE_SUPABASE_URL: ${{ vars.MOBILE_SUPABASE_URL }}
          MOBILE_SUPABASE_ANON_KEY: ${{ vars.MOBILE_SUPABASE_ANON_KEY }}
        run: dart run tool/prepare_build.dart --ci
      - run: flutter build ios --release --no-codesign --dart-define-from-file=build/verified-defines.json
      - uses: actions/upload-artifact@v4
        with:
          name: reasonai-ios-unsigned-${{ github.sha }}
          path: mobile/build/ios/iphoneos/Runner.app
          if-no-files-found: error
