<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1180" viewBox="0 0 720 1180" role="img" aria-labelledby="title desc">
<title id="title">ReasonAI ReasonAI Mobile mobile-friendly architecture overview</title>
<desc id="desc">Portrait-layout overview of ReasonAI ReasonAI Mobile, optimized for phone-size GitHub README viewing. Includes the implemented trust boundaries and service responsibilities.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#122442"/><stop offset=".54" stop-color="#0B1224"/><stop offset="1" stop-color="#251A42"/></linearGradient>
<linearGradient id="wash" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#56D9CC" stop-opacity=".10"/><stop offset="1" stop-color="#AE91FA" stop-opacity=".09"/></linearGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#b7d6ee" stroke-opacity=".065"/></pattern></defs>
<rect width="720" height="1180" rx="26" fill="url(#bg)"/>
<rect x="1" y="1" width="718" height="1178" rx="25" stroke="#667A9C" stroke-opacity=".6" fill="none"/>
<rect width="720" height="1180" rx="26" fill="url(#grid)"/><text x="37" y="61" fill="#F7FAFF" font-size="43" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800" text-anchor="start" letter-spacing="0">ReasonAI Mobile</text><text x="38" y="98" fill="#B8C7DD" font-size="21" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="540" text-anchor="start" letter-spacing="0">Native Flutter learning, backed by real evidence</text><path d="M37 122H683" stroke="#45607E" stroke-width="2"/><text x="38" y="155" fill="#58DEC9" font-size="16" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800" text-anchor="start" letter-spacing="1.5">SYSTEM LAYERS &amp; TRUST BOUNDARIES</text><rect x="36" y="178" width="648" height="160" rx="17" fill="#18263D" stroke="#4A6483" stroke-width="1.5"/><rect x="36" y="194" width="6" height="128" rx="3" fill="#58DEC9"/><circle cx="649" cy="205" r="5.5" fill="#58DEC9"/><text x="61" y="212" fill="#58DEC9" font-size="16" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="820" text-anchor="start" letter-spacing="1.2">01  FLUTTER APP</text><text x="61" y="249" fill="#F7FAFF" font-size="29" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="720" text-anchor="start" letter-spacing="0">Feed · DSA · Revise · Library · Me</text><text x="61" y="287" fill="#B8C7DD" font-size="21" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="510" text-anchor="start" letter-spacing="0">Riverpod state + go_router navigation</text><text x="61" y="317" fill="#B8C7DD" font-size="21" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="510" text-anchor="start" letter-spacing="0">Supabase OAuth / authenticated sessions</text><rect x="36" y="357" width="648" height="160" rx="17" fill="#18263D" stroke="#4A6483" stroke-width="1.5"/><rect x="36" y="373" width="6" height="128" rx="3" fill="#91BFFF"/><circle cx="649" cy="384" r="5.5" fill="#91BFFF"/><text x="61" y="391" fill="#91BFFF" font-size="16" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="820" text-anchor="start" letter-spacing="1.2">02  TWO API CLIENTS</text><text x="61" y="428" fill="#F7FAFF" font-size="29" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="720" text-anchor="start" letter-spacing="0">FastAPI + Next.js via Dio</text><text x="61" y="466" fill="#B8C7DD" font-size="21" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="510" text-anchor="start" letter-spacing="0">FastAPI serves catalog/progress/feed</text><text x="61" y="496" fill="#B8C7DD" font-size="21" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="510" text-anchor="start" letter-spacing="0">Next.js serves AI, execution and reports</text><rect x="36" y="536" width="648" height="160" rx="17" fill="#18263D" stroke="#4A6483" stroke-width="1.5"/><rect x="36" y="552" width="6" height="128" rx="3" fill="#58DEC9"/><circle cx="649" cy="563" r="5.5" fill="#58DEC9"/><text x="61" y="570" fill="#58DEC9" font-size="16" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="820" text-anchor="start" letter-spacing="1.2">03  SERVER-SIDE CODE RUN</text><text x="61" y="607" fill="#F7FAFF" font-size="29" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="720" text-anchor="start" letter-spacing="0">Run and Submit use Nebius ConTree</text><text x="61" y="645" fill="#B8C7DD" font-size="21" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="510" text-anchor="start" letter-spacing="0">No Pyodide or Python runtime on phone</text><text x="61" y="675" fill="#B8C7DD" font-size="21" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="510" text-anchor="start" letter-spacing="0">Private judging stays behind server API</text><rect x="36" y="715" width="648" height="160" rx="17" fill="#18263D" stroke="#4A6483" stroke-width="1.5"/><rect x="36" y="731" width="6" height="128" rx="3" fill="#BEA8FF"/><circle cx="649" cy="742" r="5.5" fill="#BEA8FF"/><text x="61" y="749" fill="#BEA8FF" font-size="16" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="820" text-anchor="start" letter-spacing="1.2">04  AI + CURRENT RESEARCH</text><text x="61" y="786" fill="#F7FAFF" font-size="29" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="720" text-anchor="start" letter-spacing="0">Nemotron via Nebius Token Factory</text><text x="61" y="824" fill="#B8C7DD" font-size="21" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="510" text-anchor="start" letter-spacing="0">NDJSON tutor and story chat streams</text><text x="61" y="854" fill="#B8C7DD" font-size="21" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="510" text-anchor="start" letter-spacing="0">Tavily research invoked on server</text><rect x="36" y="894" width="648" height="160" rx="17" fill="#18263D" stroke="#4A6483" stroke-width="1.5"/><rect x="36" y="910" width="6" height="128" rx="3" fill="#91BFFF"/><circle cx="649" cy="921" r="5.5" fill="#91BFFF"/><text x="61" y="928" fill="#91BFFF" font-size="16" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="820" text-anchor="start" letter-spacing="1.2">05  DEVICE PERSISTENCE</text><text x="61" y="965" fill="#F7FAFF" font-size="29" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="720" text-anchor="start" letter-spacing="0">Per-account Drift / SQLite</text><text x="61" y="1003" fill="#B8C7DD" font-size="21" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="510" text-anchor="start" letter-spacing="0">Saved stories · drafts · recovery IDs</text><text x="61" y="1033" fill="#B8C7DD" font-size="21" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="510" text-anchor="start" letter-spacing="0">Not a full offline-sync replica</text><rect x="36" y="1085" width="648" height="64" rx="13" fill="url(#wash)" stroke="#657391"/><text x="53" y="1110" fill="#F7FAFF" font-size="20" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="660" text-anchor="start" letter-spacing="0">No provider keys or hidden fixtures in Flutter.</text><text x="53" y="1136" fill="#58DEC9" font-size="19" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="650" text-anchor="start" letter-spacing="0">System Design canvas stays web-only.</text><text x="37" y="1168" fill="#879DBB" font-size="13" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="750" text-anchor="start" letter-spacing="1">REASONAI · REASONAI MOBILE · PHONE EDITION</text></svg>