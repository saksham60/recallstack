<title id="title">ReasonAI Mobile: Flutter client and server authority architecture</title><desc id="desc">Flutter, Riverpod and go_router present five mobile navigation destinations. Supabase Auth is shared with both authenticated Dio clients; account scoped Drift SQLite holds local drafts and saved story cache. FastAPI product API serves Knowledge, DSA catalog, progress, bookmarks, reviews and PostgreSQL backed state; Next.js/Vercel serves streaming Nemotron and Tavily AI, DSA submission, history and reports. Vercel Queue dispatches to Nebius ConTree isolated Python sandbox and deterministic judge. Mobile has no Pyodide or System Design Go WebSocket canvas.</desc>
