<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1180" viewBox="0 0 720 1180" role="img" aria-labelledby="title desc">
<title id="title">ReasonAI ReasonAI Mobile mobile-friendly three product workflows</title>
<desc id="desc">Portrait-layout overview of ReasonAI ReasonAI Mobile, optimized for phone-size GitHub README viewing. Includes the implemented trust boundaries and service responsibilities.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#122442"/><stop offset=".54" stop-color="#0B1224"/><stop offset="1" stop-color="#251A42"/></linearGradient>
<linearGradient id="wash" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#56D9CC" stop-opacity=".10"/><stop offset="1" stop-color="#AE91FA" stop-opacity=".09"/></linearGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#b7d6ee" stroke-opacity=".065"/></pattern></defs>
<rect width="720" height="1180" rx="26" fill="url(#bg)"/>
<rect x="1" y="1" width="718" height="1178" rx="25" stroke="#667A9C" stroke-opacity=".6" fill="none"/>
<rect width="720" height="1180" rx="26" fill="url(#grid)"/><text x="37" y="61" fill="#F7FAFF" font-size="42" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800" text-anchor="start" letter-spacing="0">ReasonAI Mobile</text><text x="38" y="95" fill="#B8C7DD" font-size="22" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="560" text-anchor="start" letter-spacing="0">Three real engineering workflows</text><path d="M36 121H684" stroke="#45607E" stroke-width="2"/><rect x="36" y="158" width="648" height="305" rx="18" fill="#17253D" stroke="#4E6381" stroke-width="1.5"/><rect x="36" y="158" width="648" height="54" rx="18" fill="#58DEC9" fill-opacity=".09"/><text x="57" y="193" fill="#58DEC9" font-size="22" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800" text-anchor="start" letter-spacing="1.1">DISCOVER  /  KNOWLEDGE</text><circle cx="77" cy="245" r="18" fill="#263C53" stroke="#58DEC9" stroke-width="1.7"/><text x="77" y="253" fill="#F7FAFF" font-size="18" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="780" text-anchor="middle" letter-spacing="0">1</text><text x="109" y="252" fill="#F7FAFF" font-size="21" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="610" text-anchor="start" letter-spacing="0">FastAPI serves prepared story feed</text><path d="M77 264V290" stroke="#58DEC9" stroke-width="2" stroke-dasharray="3 4" opacity=".76"/><circle cx="77" cy="307" r="18" fill="#263C53" stroke="#58DEC9" stroke-width="1.7"/><text x="77" y="315" fill="#F7FAFF" font-size="18" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="780" text-anchor="middle" letter-spacing="0">2</text><text x="109" y="314" fill="#F7FAFF" font-size="21" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="610" text-anchor="start" letter-spacing="0">Open story → Ask ReasonAI stream</text><path d="M77 326V352" stroke="#58DEC9" stroke-width="2" stroke-dasharray="3 4" opacity=".76"/><circle cx="77" cy="369" r="18" fill="#263C53" stroke="#58DEC9" stroke-width="1.7"/><text x="77" y="377" fill="#F7FAFF" font-size="18" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="780" text-anchor="middle" letter-spacing="0">3</text><text x="109" y="376" fill="#F7FAFF" font-size="21" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="610" text-anchor="start" letter-spacing="0">Nemotron + optional Tavily citations</text><rect x="56" y="419" width="609" height="30" rx="7" fill="#58DEC9" fill-opacity=".09"/><text x="70" y="440" fill="#58DEC9" font-size="18" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="640" text-anchor="start" letter-spacing="0">Story state and feed are separate paths</text><rect x="36" y="486" width="648" height="305" rx="18" fill="#17253D" stroke="#4E6381" stroke-width="1.5"/><rect x="36" y="486" width="648" height="54" rx="18" fill="#91BFFF" fill-opacity=".09"/><text x="57" y="521" fill="#91BFFF" font-size="22" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800" text-anchor="start" letter-spacing="1.1">PRACTICE  /  DSA</text><circle cx="77" cy="573" r="18" fill="#263C53" stroke="#91BFFF" stroke-width="1.7"/><text x="77" y="581" fill="#F7FAFF" font-size="18" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="780" text-anchor="middle" letter-spacing="0">1</text><text x="109" y="580" fill="#F7FAFF" font-size="21" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="610" text-anchor="start" letter-spacing="0">Search catalog; write Python on device</text><path d="M77 592V618" stroke="#91BFFF" stroke-width="2" stroke-dasharray="3 4" opacity=".76"/><circle cx="77" cy="635" r="18" fill="#263C53" stroke="#91BFFF" stroke-width="1.7"/><text x="77" y="643" fill="#F7FAFF" font-size="18" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="780" text-anchor="middle" letter-spacing="0">2</text><text x="109" y="642" fill="#F7FAFF" font-size="21" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="610" text-anchor="start" letter-spacing="0">Run/Submit via authenticated Web API</text><path d="M77 654V680" stroke="#91BFFF" stroke-width="2" stroke-dasharray="3 4" opacity=".76"/><circle cx="77" cy="697" r="18" fill="#263C53" stroke="#91BFFF" stroke-width="1.7"/><text x="77" y="705" fill="#F7FAFF" font-size="18" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="780" text-anchor="middle" letter-spacing="0">3</text><text x="109" y="704" fill="#F7FAFF" font-size="21" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="610" text-anchor="start" letter-spacing="0">ConTree judging → history + AI review</text><rect x="56" y="747" width="609" height="30" rx="7" fill="#91BFFF" fill-opacity=".09"/><text x="70" y="768" fill="#91BFFF" font-size="18" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="640" text-anchor="start" letter-spacing="0">No on-device Pyodide or hidden cases</text><rect x="36" y="814" width="648" height="305" rx="18" fill="#17253D" stroke="#4E6381" stroke-width="1.5"/><rect x="36" y="814" width="648" height="54" rx="18" fill="#BEA8FF" fill-opacity=".09"/><text x="57" y="849" fill="#BEA8FF" font-size="22" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800" text-anchor="start" letter-spacing="1.1">RETAIN  /  PERSONAL STATE</text><circle cx="77" cy="901" r="18" fill="#263C53" stroke="#BEA8FF" stroke-width="1.7"/><text x="77" y="909" fill="#F7FAFF" font-size="18" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="780" text-anchor="middle" letter-spacing="0">1</text><text x="109" y="908" fill="#F7FAFF" font-size="21" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="610" text-anchor="start" letter-spacing="0">Revision and bookmarks use FastAPI</text><path d="M77 920V946" stroke="#BEA8FF" stroke-width="2" stroke-dasharray="3 4" opacity=".76"/><circle cx="77" cy="963" r="18" fill="#263C53" stroke="#BEA8FF" stroke-width="1.7"/><text x="77" y="971" fill="#F7FAFF" font-size="18" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="780" text-anchor="middle" letter-spacing="0">2</text><text x="109" y="970" fill="#F7FAFF" font-size="21" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="610" text-anchor="start" letter-spacing="0">Drift stores per-account cache/drafts</text><path d="M77 982V1008" stroke="#BEA8FF" stroke-width="2" stroke-dasharray="3 4" opacity=".76"/><circle cx="77" cy="1025" r="18" fill="#263C53" stroke="#BEA8FF" stroke-width="1.7"/><text x="77" y="1033" fill="#F7FAFF" font-size="18" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="780" text-anchor="middle" letter-spacing="0">3</text><text x="109" y="1032" fill="#F7FAFF" font-size="21" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="610" text-anchor="start" letter-spacing="0">Server remains source of learning truth</text><rect x="56" y="1075" width="609" height="30" rx="7" fill="#BEA8FF" fill-opacity=".09"/><text x="70" y="1096" fill="#BEA8FF" font-size="18" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="640" text-anchor="start" letter-spacing="0">Offline device sync is not fully wired</text><rect x="36" y="1156" width="648" height="4" rx="2" fill="url(#wash)"/><text x="39" y="1175" fill="#879DBB" font-size="12" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="710" text-anchor="start" letter-spacing="0.6">REASONAI · WORKFLOWS OPTIMIZED FOR PHONE READERS</text></svg>