org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Pub cache and workspace can be on different Windows drives. Kotlin's
# incremental path cache cannot relativize them; use reproducible compilation.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
