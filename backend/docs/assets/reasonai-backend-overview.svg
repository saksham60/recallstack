<title id="title">ReasonAI backend architecture: FastAPI deterministic domain APIs, separate Knowledge job and PostgreSQL state</title>
<desc id="desc">Web and mobile clients use verified Supabase JWT bearer identity to reach FastAPI Cloud Run. Domain routers and application services use a SQLAlchemy Unit of Work with Supabase PostgreSQL for DSA content, learner progress, diagrams, Knowledge and admin. Online feed reads use deterministic ranking without inference. A separate Cloud Run Knowledge refresh job uses a PostgreSQL advisory lock, Tavily and Hacker News discovery, image validation, NVIDIA Nemotron on Nebius Token Factory and Cloudflare R2. Sync uses owner-scoped idempotent mutation ledgers and cursors. Next.js LangGraph interactive inference, Nebius ConTree judging, and Go WebSocket collaboration are outside the backend API runtime.</desc>
