<title id="title">ReasonAI backend workflows for verified API, offline Knowledge ingestion and idempotent device synchronization</title>
<desc id="desc">Three implementation workflows: Supabase JWT verification to FastAPI/Pydantic to domain application Unit of Work to PostgreSQL. Knowledge refresh uses advisory lock with Tavily and Hacker News discovery, quality and image validation, Nebius Nemotron enrichment, Cloudflare R2 and committed stories before deterministic feed reads. Offline device sync verifies owner and mutation identity, applies transactionally with a mutation ledger, then serves cursor-based incremental pull or full resync with acknowledgement. The backend does not run interactive LangGraph agents or Nebius ConTree Submit.</desc>
<text x="55" y="62" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="820" font-size="27" fill="#f2f7ff">THREE WORKFLOWS. ONE AUTHORITATIVE DATA BOUNDARY.</text>
<text x="55" y="94" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="550" font-size="19" fill="#a7b9ce">API transactions, Knowledge production, and replay-safe learner state.</text>
