<title id="title">ReasonAI Web: three engineering workflows across coding, System Design and Knowledge</title>
<desc id="desc">Three workflows: DSA Monaco editor and browser-local Pyodide public Run then queued Nebius ConTree sandbox Submit, deterministic verdict and saved Nemotron Code Intelligence. System Design Konva canvas, Nemotron LangGraph proposal and Tavily research, schema checks, human Accept or Discard and Go Live Share. Knowledge Tavily discovery, offline Nemotron enrichment, prepared Supabase R2 content, feed and live search-grounded chat. These are architecture illustrations, not screenshots of completed user-acceptance events.</desc>
<text x="55" y="61" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="800" fill="#f0f6ff">THREE WEB WORKFLOWS · ONE TRUST BOUNDARY</text>
<text x="55" y="94" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="560" fill="#abc0d7">Code executes. Models reason. Engineers review.</text>
