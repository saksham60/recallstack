<title id="title">ReasonAI Web: verified browser, agent, sandbox and collaboration architecture</title>
<desc id="desc">Next.js 16 and React browser with Monaco editor, Pyodide local public Run, Konva System Design and Knowledge Feed. Supabase Auth protects Next.js server routes and FastAPI Cloud Run product APIs. DSA Submit flows through Vercel Queue, Nebius ConTree isolated sandbox and a deterministic judge to Supabase, then Nemotron Code Intelligence. System Design uses LangGraph and NVIDIA Nemotron through Nebius Token Factory for proposals checked by typed validators and approved by the user; Go WebSocket Live Share orders committed edits. Knowledge Feed uses Tavily offline discovery, Nemotron enrichment, PostgreSQL and Cloudflare R2. Tools and provider keys remain server-side.</desc>
